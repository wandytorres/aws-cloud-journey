apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: logging
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki-Custom
        type: loki
        access: proxy
        url: http://loki:3100
        editable: true
