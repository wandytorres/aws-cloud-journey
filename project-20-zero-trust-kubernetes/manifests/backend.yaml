apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zero-trust

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        tier: backend

    spec:
      containers:
      - name: backend
        image: hashicorp/http-echo
        args:
        - "-text=backend service"
        - "-listen=:5678"

        ports:
        - containerPort: 5678

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zero-trust

spec:
  selector:
    app: backend

  ports:
  - port: 5678
    targetPort: 5678
